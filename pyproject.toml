[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyndon-word-pairings"
version = "0.1.0"
description = "Tools for Lyndon words and pairing matrices / NC polynomials"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "sympy"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "word", "nc_polynomial", "pairing_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=55",
]

[tool.coverage.run]
source = ["src"]
